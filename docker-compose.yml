services:
  synapse:
    container_name: synapse
    image: matrixdotorg/synapse:latest
    restart: always
    ports:
      - 8008:8008
    volumes:
      - ${WORKDIR}/synapse-data:/data
    networks:
      luxchat-network:
        ipv4_address: 172.20.0.2

