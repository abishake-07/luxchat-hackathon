  attendance-bot:
    container_name: attendance-bot
    build:
      context: ${WORKDIR}/simple-bot
      dockerfile: Dockerfile
    image: attendance-bot:latest
    depends_on:
      synapse:
        condition: service_started
    volumes:
      - ${WORKDIR}/simple-bot/etc_hosts:/etc/hosts:ro
      - ${WORKDIR}/simple-bot/config.ini:/bot/config.ini
      - ${WORKDIR}/simple-bot/data:/bot/data
    networks:
      luxchat-network:
        ipv4_address: 172.20.0.6

  spaces-bot:
    container_name: spaces-bot
    build:
      context: ${WORKDIR}/luxchat-spaces-manager
      dockerfile: Dockerfile
    depends_on:
      synapse:
        condition: service_started
    volumes:
      - ${WORKDIR}/simple-bot/etc_hosts:/etc/hosts:ro
      - ${WORKDIR}/luxchat-spaces-manager/config.ini:/bot/config.ini
      - ${WORKDIR}/luxchat-spaces-manager/data:/bot/data
    networks:
      luxchat-network:
        ipv4_address: 172.20.0.7

networks:
  luxchat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1